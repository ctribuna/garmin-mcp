name: Feature request
description: Suggest a new tool or a change to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or change
      description: Describe the tool or behaviour you would like. Include example inputs and outputs if you can.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Garmin Connect endpoint (if known)
      description: The API path or the python-garminconnect method that provides this data, if you know it.
      placeholder: e.g. /activitylist-service/activities/search/activities
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
