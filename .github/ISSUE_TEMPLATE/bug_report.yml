name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections
        below. Do not include secrets, tokens, or your endpoint URL. See the
        checklist at the end.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include the error message if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool called
      description: The MCP tool name, for example `garmin_status` or `get_activities`.
      placeholder: e.g. get_activities
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      description: Which client were you using?
      options:
        - Claude
        - ChatGPT
        - Claude Code
        - Cursor
        - Other
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of the `garmin_status` tool
      description: |
        Paste the result of calling `garmin_status`. Remove anything that looks
        like a token, cookie, or URL before pasting.
      render: json
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this report contains no secrets, Garmin tokens, `MCP_AUTH_TOKEN` values, or endpoint URLs, and no personal health data.
          required: true
